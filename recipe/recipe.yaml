schema_version: 1

context:
  name: nomad-camels-driver-keysight-b2912a
  version: "0.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_camels_driver_keysight_b2912a-${{ version }}.tar.gz
  sha256: efa14e7eaa35ebe42f42cfe273be42ed40fcd71cd4bbeeebd034e042b7caba13

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - pyvisa
    - pyvisa-py

tests:
  - python:
      imports:
        - nomad_camels_driver_keysight_b2912a
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Device driver for the Keysight B2912A precision SMU.
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/FAU-LAP/CAMELS_drivers

extra:
  recipe-maintainers:
    - jan-janssen
